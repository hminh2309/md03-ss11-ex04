spring.application.name=Session11
# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_session11
spring.datasource.username=postgres
spring.datasource.password=23092007
spring.datasource.driver-class-name=org.postgresql.Driver
# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.file.name=logs/patient_web_service.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-history=7
# 1. Log của toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO
# 2. Log của Hibernate/JPA ở mức DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# 3. Log của package ở mức TRACE
logging.level.com.medical.service=TRACE
logging.level.org.example.session11=TRACE